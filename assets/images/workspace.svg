<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e12"/>
      <stop offset="50%" stop-color="#13141b"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ff5252"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171922"/>
      <stop offset="100%" stop-color="#0f1016"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Neon Ambient Backlight behind monitors -->
  <circle cx="400" cy="220" r="160" fill="#ff1744" opacity="0.12" filter="url(#glow)"/>
  <circle cx="240" cy="200" r="120" fill="#ff5252" opacity="0.08" filter="url(#glow)"/>

  <!-- Desk Surface -->
  <path d="M50 420 L750 420 L720 460 L80 460 Z" fill="#1c1d25" stroke="rgba(255,255,255,0.06)"/>
  <line x1="50" y1="420" x2="750" y2="420" stroke="#ff1744" stroke-width="2" opacity="0.6" filter="url(#glow)"/>

  <!-- Left Monitor (Vertical/Documentation/Terminal) -->
  <g transform="translate(120, 100)">
    <rect x="0" y="0" width="170" height="280" rx="8" fill="#1a1b24" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect x="6" y="6" width="158" height="268" rx="4" fill="url(#screen-grad)"/>
    <!-- Terminal Header -->
    <rect x="6" y="6" width="158" height="18" fill="#222430"/>
    <circle cx="16" cy="15" r="3" fill="#ff5f56"/>
    <circle cx="26" cy="15" r="3" fill="#ffbd2e"/>
    <circle cx="36" cy="15" r="3" fill="#27c93f"/>
    <!-- Terminal lines -->
    <text x="16" y="42" fill="#ff1744" font-family="monospace" font-size="10">~/portfolio4 $</text>
    <text x="96" y="42" fill="#8ee06d" font-family="monospace" font-size="10">python</text>
    <text x="16" y="58" fill="#8892b0" font-family="monospace" font-size="9">manage.py runserver</text>
    <text x="16" y="78" fill="#64ffda" font-family="monospace" font-size="9">Django v5.0 Active</text>
    <text x="16" y="94" fill="#a8b2d1" font-family="monospace" font-size="8.5">Starting development server at</text>
    <text x="16" y="108" fill="#ff5252" font-family="monospace" font-size="8.5">http://127.0.0.1:8000/</text>
    <text x="16" y="126" fill="#5c677d" font-family="monospace" font-size="8">Quit server with CONTROL-C.</text>
    
    <!-- Code block visualization -->
    <rect x="16" y="150" width="90" height="6" rx="2" fill="rgba(255,23,68,0.7)"/>
    <rect x="16" y="164" width="120" height="5" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="26" y="176" width="100" height="5" rx="2" fill="rgba(100,255,218,0.6)"/>
    <rect x="26" y="188" width="80" height="5" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="16" y="200" width="60" height="5" rx="2" fill="rgba(255,189,46,0.6)"/>
    <rect x="16" y="220" width="130" height="35" rx="4" fill="rgba(255,23,68,0.06)" stroke="rgba(255,23,68,0.2)"/>
    <text x="24" y="240" fill="#ff5252" font-family="monospace" font-size="9">HTTP/1.1 200 OK</text>
    
    <!-- Stand -->
    <rect x="75" y="280" width="20" height="35" fill="#2b2d3d"/>
    <path d="M60 315 L110 315 L120 322 L50 322 Z" fill="#222430"/>
  </g>

  <!-- Main Ultra-Wide Monitor (VS Code IDE) -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="380" height="250" rx="8" fill="#1a1b24" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="6" y="6" width="368" height="238" rx="4" fill="#0d0f14"/>
    
    <!-- IDE Titlebar -->
    <rect x="6" y="6" width="368" height="22" fill="#161821"/>
    <circle cx="18" cy="17" r="3.5" fill="#ff5f56"/>
    <circle cx="30" cy="17" r="3.5" fill="#ffbd2e"/>
    <circle cx="42" cy="17" r="3.5" fill="#27c93f"/>
    <rect x="65" y="11" width="95" height="14" rx="3" fill="#202330"/>
    <text x="75" y="22" fill="#ffffff" font-family="sans-serif" font-size="9">views.py - Django</text>
    <rect x="165" y="11" width="85" height="14" rx="3" fill="#161821"/>
    <text x="175" y="22" fill="#707589" font-family="sans-serif" font-size="9">models.py</text>
    
    <!-- IDE Sidebar -->
    <rect x="6" y="28" width="40" height="216" fill="#12131a"/>
    <circle cx="26" cy="45" r="5" fill="#ff1744" opacity="0.8"/>
    <circle cx="26" cy="65" r="5" fill="#4f566b"/>
    <circle cx="26" cy="85" r="5" fill="#4f566b"/>
    
    <!-- Code Editor Content -->
    <g transform="translate(55, 40)" font-family="monospace" font-size="10.5">
      <!-- Line 1 -->
      <text x="0" y="10" fill="#5c677d">1</text>
      <text x="20" y="10" fill="#ff5252">from</text>
      <text x="54" y="10" fill="#e6edf3"> django.shortcuts </text>
      <text x="165" y="10" fill="#ff5252">import</text>
      <text x="212" y="10" fill="#e6edf3"> render</text>
      
      <!-- Line 2 -->
      <text x="0" y="28" fill="#5c677d">2</text>
      <text x="20" y="28" fill="#ff5252">from</text>
      <text x="54" y="28" fill="#e6edf3"> .models </text>
      <text x="110" y="28" fill="#ff5252">import</text>
      <text x="157" y="28" fill="#64ffda"> Application</text>
      
      <!-- Line 3 -->
      <text x="0" y="46" fill="#5c677d">3</text>
      
      <!-- Line 4 -->
      <text x="0" y="64" fill="#5c677d">4</text>
      <text x="20" y="64" fill="#387eb8">def</text>
      <text x="48" y="64" fill="#ffd166"> google_suite_view</text>
      <text x="175" y="64" fill="#e6edf3">(request):</text>
      
      <!-- Line 5 -->
      <text x="0" y="82" fill="#5c677d">5</text>
      <text x="36" y="82" fill="#707589"># Google apps: YouTube, Photos, Maps</text>
      
      <!-- Line 6 -->
      <text x="0" y="100" fill="#5c677d">6</text>
      <text x="36" y="100" fill="#e6edf3">apps = [</text>
      <text x="88" y="100" fill="#8ee06d">'YouTube'</text>
      <text x="142" y="100" fill="#e6edf3">, </text>
      <text x="154" y="100" fill="#8ee06d">'Google Photos'</text>
      <text x="245" y="100" fill="#e6edf3">, </text>
      <text x="255" y="100" fill="#8ee06d">'Google Maps'</text>
      <text x="305" y="100" fill="#e6edf3">]</text>
      
      <!-- Line 7 -->
      <text x="0" y="118" fill="#5c677d">7</text>
      <text x="36" y="118" fill="#ff5252">return</text>
      <text x="80" y="118" fill="#e6edf3"> render(request, </text>
      <text x="180" y="118" fill="#8ee06d">'core/index.html'</text>
      <text x="285" y="118" fill="#e6edf3">, context)</text>

      <!-- Status banner -->
      <rect x="0" y="145" width="310" height="35" rx="4" fill="rgba(255,23,68,0.1)" stroke="rgba(255,23,68,0.3)"/>
      <circle cx="14" cy="162" r="4" fill="#00e676"/>
      <text x="26" y="166" fill="#ffffff" font-size="10" font-family="sans-serif">Python Full-Stack Trainee | Burra Kirani</text>
    </g>

    <!-- Main Stand -->
    <rect x="175" y="250" width="30" height="60" fill="#2b2d3d"/>
    <path d="M145 310 L235 310 L250 322 L130 322 Z" fill="#222430" stroke="rgba(255,255,255,0.05)"/>
  </g>

  <!-- Mechanical Keyboard & Glowing Mousepad -->
  <g transform="translate(280, 395)">
    <!-- RGB Mat -->
    <rect x="-40" y="0" width="380" height="45" rx="6" fill="#14151c" stroke="#ff1744" stroke-width="1.2" opacity="0.8"/>
    <!-- Keyboard -->
    <rect x="-15" y="6" width="230" height="32" rx="4" fill="#1e202b" stroke="rgba(255,255,255,0.1)"/>
    <!-- Keys rows -->
    <rect x="-7" y="10" width="214" height="4" rx="1" fill="rgba(255,255,255,0.2)"/>
    <rect x="-7" y="17" width="214" height="4" rx="1" fill="rgba(255,255,255,0.2)"/>
    <rect x="-7" y="24" width="214" height="4" rx="1" fill="rgba(255,255,255,0.2)"/>
    <rect x="40" y="31" width="70" height="4" rx="1" fill="#ff1744"/>
    
    <!-- Mouse -->
    <rect x="260" y="10" width="24" height="35" rx="10" fill="#222533" stroke="rgba(255,255,255,0.15)"/>
    <line x1="272" y1="10" x2="272" y2="22" stroke="#ff1744" stroke-width="1.5"/>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(690, 390)">
    <rect x="0" y="5" width="26" height="32" rx="3" fill="#ff1744" opacity="0.9"/>
    <path d="M26 12 C34 12, 34 26, 26 26" stroke="#ff1744" stroke-width="3" fill="none"/>
    <!-- Steam -->
    <path d="M8 2 Q11 -5 8 -10" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
    <path d="M16 2 Q19 -5 16 -10" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  </g>
</svg>